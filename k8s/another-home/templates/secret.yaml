apiVersion: v1
kind: Secret
metadata:
  name: another-home-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword must be set (see values.yaml)" .Values.secrets.dbPassword | quote }}
  ASGARDEO_JWKS_URI: {{ .Values.secrets.asgardeoJwksUri | quote }}
  ASGARDEO_TENANT: {{ .Values.secrets.asgardeoTenant | quote }}
  ASGARDEO_ADMIN_CLIENT_ID: {{ .Values.secrets.asgardeoAdminClientId | quote }}
  ASGARDEO_ADMIN_CLIENT_SECRET: {{ .Values.secrets.asgardeoAdminClientSecret | quote }}
  ASGARDEO_WARDEN_ROLE_ID: {{ .Values.secrets.asgardeoWardenRoleId | quote }}
  # The whole Firebase service account JSON, as one string. Left empty until set —
  # the notification service falls back to logging instead of sending real pushes.
  FIREBASE_SERVICE_ACCOUNT_JSON: {{ .Values.secrets.firebaseServiceAccountJson | quote }}
