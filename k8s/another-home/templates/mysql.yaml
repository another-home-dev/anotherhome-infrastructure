apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.mysql.storageSize }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: {{ .Values.namespace }}
data:
  01-create-databases.sql: |
    CREATE DATABASE IF NOT EXISTS another_home_finance;
    CREATE DATABASE IF NOT EXISTS operations_service;
    CREATE DATABASE IF NOT EXISTS notification_service;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      annotations:
        # Autopilot otherwise evicts these single-replica pods whenever it removes an
        # underused node, taking the service down for ~30s while it restarts elsewhere.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: db
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: another-home-secrets
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.defaultDatabase | quote }}
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-init
          configMap:
            name: mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: db
  ports:
    - port: 3306
      targetPort: 3306
