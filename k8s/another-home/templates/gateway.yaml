apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      annotations:
        # Autopilot otherwise evicts these single-replica pods whenever it removes an
        # underused node, taking the service down for ~30s while it restarts elsewhere.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: Always
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
          env:
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            - name: GATEWAY_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: another-home-config
                  key: GATEWAY_PUBLIC_URL
            - name: ASGARDEO_JWKS_URI
              valueFrom:
                secretKeyRef:
                  name: another-home-secrets
                  key: ASGARDEO_JWKS_URI
            - name: ASGARDEO_TENANT
              valueFrom:
                secretKeyRef:
                  name: another-home-secrets
                  key: ASGARDEO_TENANT
            - name: ASGARDEO_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: another-home-secrets
                  key: ASGARDEO_ADMIN_CLIENT_ID
            - name: ASGARDEO_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: another-home-secrets
                  key: ASGARDEO_ADMIN_CLIENT_SECRET
            - name: ASGARDEO_WARDEN_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: another-home-secrets
                  key: ASGARDEO_WARDEN_ROLE_ID
          readinessProbe:
            tcpSocket:
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: gateway
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
